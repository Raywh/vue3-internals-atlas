<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Vue 3 内核知识图谱 · AOCI-CODE 索引</title>
<style>
  :root{
    --bg:#0b0e14; --bg2:#111621; --line:#243044;
    --fg:#e6edf7; --dim:#8b9ab1; --dim2:#5d6b82; --vue:#42b883;
    --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{background:var(--bg);color:var(--fg);font-family:var(--sans);overflow:hidden;-webkit-font-smoothing:antialiased}
  #app{display:grid;grid-template-columns:262px 1fr 392px;grid-template-rows:52px 1fr;height:100vh}
  header{grid-column:1/-1;display:flex;align-items:center;gap:14px;padding:0 16px;
    background:linear-gradient(180deg,#10151f,#0b0e14);border-bottom:1px solid var(--line);z-index:5}
  .logo{display:flex;align-items:baseline;gap:8px;font-weight:650}
  .logo b{color:var(--vue);font-size:15px}
  .logo span{font-size:12px;color:var(--dim2)}
  .search{margin-left:auto;display:flex;align-items:center;gap:10px}
  .search input{background:#0e131d;border:1px solid var(--line);color:var(--fg);border-radius:7px;
    padding:7px 11px;width:270px;font-size:12.5px;font-family:var(--mono);outline:none}
  .search input:focus{border-color:var(--vue)}
  .stat{font-size:11px;color:var(--dim2);font-family:var(--mono);white-space:nowrap}

  aside.left{border-right:1px solid var(--line);background:var(--bg2);overflow-y:auto;padding:10px 0 40px}
  .sect{padding:10px 14px 6px;font-size:10.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--dim2)}
  .chap{display:block;width:100%;text-align:left;background:none;border:0;border-left:2px solid transparent;
    color:var(--dim);padding:9px 14px 9px 15px;cursor:pointer;font-size:12.5px;line-height:1.45;transition:.13s}
  .chap:hover{background:#161d2b;color:var(--fg)}
  .chap.on{background:#16202f;border-left-color:var(--vue);color:var(--fg)}
  .chap i{display:block;font-style:normal;font-size:10px;color:var(--dim2);font-family:var(--mono);margin-bottom:2px}
  .chap em{display:block;font-style:normal;color:var(--dim2);font-size:11px;margin-top:3px}

  main{position:relative;overflow:hidden;background:radial-gradient(1200px 700px at 50% 40%,#111a26 0%,#0b0e14 62%)}
  canvas{display:block;width:100%;height:100%;cursor:grab;outline:none}
  canvas.drag{cursor:grabbing}

  /* ── 画布里的节点：圆点随缩放，标签固定字号（两层 drawable）── */
  .node{position:absolute;left:0;top:0;border-radius:50%;background:var(--c);pointer-events:none;
    box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.16)}
  .node.hot{box-shadow:inset 0 0 0 2px #fff, 0 0 0 2px rgba(66,184,131,.55)}
  .node.sel{box-shadow:inset 0 0 0 2px #fff}
  .lbl{position:absolute;left:0;top:0;pointer-events:none;font:600 10px/13px var(--mono);
    color:#b9c8dd;text-align:center;white-space:nowrap}
  .node.dim,.lbl.dim{opacity:.22}

  .legend{position:absolute;left:14px;bottom:12px;display:flex;flex-wrap:wrap;gap:10px;
    font-size:10.5px;color:var(--dim2);font-family:var(--mono);pointer-events:none;max-width:70%}
  .legend b{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;vertical-align:middle}
  .hint{position:absolute;right:14px;bottom:12px;font-size:10.5px;color:var(--dim2);font-family:var(--mono);pointer-events:none}
  .chiprow{position:absolute;left:14px;top:12px;display:flex;gap:6px;flex-wrap:wrap;max-width:72%}
  .chip{background:#111825cc;border:1px solid var(--line);color:var(--dim);border-radius:20px;
    padding:4px 10px;font-size:11px;cursor:pointer;font-family:var(--mono);backdrop-filter:blur(6px)}
  .chip.on{border-color:var(--vue);color:var(--vue);background:#12241ecc}

  .nocap{position:absolute;inset:0;display:grid;place-items:center;background:rgba(11,14,20,.92);z-index:6;padding:32px}
  .nocap[hidden]{display:none}
  .nocap div{max-width:460px;line-height:1.9;font-size:13px;color:#c3cfdf;text-align:center}
  .nocap b{color:#ffb86c}
  .nocap a{color:var(--vue)}

  aside.right{border-left:1px solid var(--line);background:var(--bg2);overflow-y:auto;padding:0 0 60px}
  .detail{padding:16px 18px}
  .path{font-family:var(--mono);font-size:11px;color:var(--vue);word-break:break-all;line-height:1.5}
  .badges{display:flex;gap:6px;flex-wrap:wrap;margin:9px 0 12px}
  .badge{font-family:var(--mono);font-size:10px;border:1px solid var(--line);border-radius:5px;padding:2px 6px;color:var(--dim)}
  .badge.tag{border-color:#2c4a3a;color:var(--vue);background:#0f1f18}
  .field{margin:0 0 13px}
  .field h4{margin:0 0 4px;font-size:10px;letter-spacing:.1em;color:var(--dim2);text-transform:uppercase;font-weight:600}
  .field p{margin:0;font-size:13px;line-height:1.62;color:#d3dded}
  .rel{display:block;font-family:var(--mono);font-size:11px;color:#6aa9ff;cursor:pointer;padding:2px 0;word-break:break-all}
  .rel:hover{text-decoration:underline;color:#8cc4ff}
  .empty{font-size:12px;color:var(--dim2);font-style:italic}
  .chapcard{padding:16px 18px}
  .chapcard h2{margin:0 0 6px;font-size:16px;line-height:1.4}
  .chapcard h3{margin:16px 0 5px;font-size:10px;letter-spacing:.1em;color:var(--dim2);text-transform:uppercase}
  .chapcard p{margin:0;font-size:12.5px;line-height:1.65;color:#c3cfdf}
  .chapcard ul{margin:0;padding-left:17px}
  .chapcard li{font-size:12.5px;line-height:1.62;color:#c3cfdf;margin-bottom:5px}
  .chapcard .time{font-family:var(--mono);font-size:10px;color:var(--dim2)}
  .readlist{margin:8px 0 0;padding:0;list-style:none}
  .readlist li{font-family:var(--mono);font-size:11px;color:#6aa9ff;cursor:pointer;padding:3px 0;
    display:flex;justify-content:space-between;gap:8px}
  .readlist li:hover{color:#8cc4ff}
  .readlist li span{color:var(--dim2);flex:none}
  .ex{background:#0f1622;border-left:2px solid #ffb86c;padding:9px 11px;border-radius:0 6px 6px 0;margin-top:6px}
  .empty-state{padding:60px 24px;text-align:center;color:var(--dim2);font-size:12.5px;line-height:1.8}
  hr{border:0;border-top:1px solid var(--line);margin:14px 0}
  ::-webkit-scrollbar{width:9px;height:9px}
  ::-webkit-scrollbar-thumb{background:#1e2837;border-radius:5px}
  ::-webkit-scrollbar-track{background:transparent}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="logo"><b>Vue 3 内核知识图谱</b><span>vuejs/core @ v3.5.46 · 节点是画布里的真 DOM（HTML-in-canvas）</span></div>
    <div class="search">
      <span class="stat" id="stat"></span>
      <input id="q" placeholder="搜索文件 / 符号 / 职责…" autocomplete="off">
    </div>
  </header>

  <aside class="left" id="chapters"></aside>

  <main id="stage">
    <canvas id="cv" content="drawable"></canvas>
    <div class="chiprow" id="chips"></div>
    <div class="legend" id="legend"></div>
    <div class="hint">拖拽平移 · 滚轮缩放 · 点节点看条目</div>
    <div class="nocap" id="nocap" hidden>
      <div>
        <p><b>这个页面需要 HTML-in-canvas</b>（Chrome / Edge 157+）。</p>
        <p>当前浏览器没有 <code>drawElementImage</code>，图区域画不出来。</p>
        <p>两个选择：换 Chromium 157+，或者看 <a href="./vue-graph-classic.html">经典 Canvas2D 版</a>（同一份数据，任何浏览器都能开）。</p>
        <p style="color:#5d6b82;font-size:12px">右栏的学习路线在下面仍然可用。</p>
      </div>
    </div>
  </main>

  <aside class="right" id="right"></aside>
</div>

<script id="data" type="application/json">__DATA__</script>
<script>
const DATA = JSON.parse(document.getElementById('data').textContent);
const nodes = DATA.nodes, edges = DATA.edges, chapters = DATA.chapters;

const PKG_COLOR = {
  reactivity:'#42b883','runtime-core':'#6aa9ff','runtime-dom':'#8bd450',
  'compiler-core':'#c792ea','compiler-dom':'#e6a2ff','compiler-sfc':'#b18aff',
  'compiler-ssr':'#a58bff','server-renderer':'#ffb86c',shared:'#ffd479',
  vue:'#ff6b81','vue-compat':'#ff9aa8','runtime-test':'#7fd1c1'
};
const byId = new Map(nodes.map(n => [n.id, n]));
const outMap = new Map(), inMap = new Map();
for (const n of nodes) { outMap.set(n.id, []); inMap.set(n.id, []); }
for (const e of edges) {
  if (!byId.has(e.from) || !byId.has(e.to)) continue;
  outMap.get(e.from).push(e.to);
  inMap.get(e.to).push(e.from);
}

const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
const stage = document.getElementById('stage');
const HIC = 'content' in document.createElement('canvas') && typeof ctx.drawElementImage === 'function';

const W = () => cv.clientWidth || 1;
const H = () => cv.clientHeight || 1;
let scale = 1, tx = 0, ty = 0;
const LABEL_MIN_SCALE = 2.0;    // 低于这个比例只有悬停/选中的节点显示标签

// ── 力导向布局（与经典版一致）：每个包一个锚点 ──
const pkgs = [...new Set(nodes.map(n => n.pkg))];
const weight = pkgs.map(p => nodes.filter(n => n.pkg === p).length);
const order = pkgs.map((p, i) => i).sort((a, b) => weight[b] - weight[a]);
const anchor = new Map();
{
  const cols = 4, gx = 360, gy = 330;
  const rows = Math.ceil(order.length / cols);
  order.forEach((idx, k) => {
    const col = k % cols, row = Math.floor(k / cols);
    anchor.set(pkgs[idx], { x: (col - (cols - 1) / 2) * gx, y: (row - (rows - 1) / 2) * gy });
  });
}

const sim = nodes.map(n => {
  const a = anchor.get(n.pkg) || { x: 0, y: 0 };
  return {
    ...n, ax: a.x, ay: a.y,
    x: a.x + (Math.random() - .5) * 170, y: a.y + (Math.random() - .5) * 170,
    vx: 0, vy: 0,
    d: Math.max(7, Math.min(24, 3.4 + Math.sqrt(n.lines) * .62)),
    el: null, bw: 0, bh: 0, cx: 0, cy: 0,
  };
});
const simById = new Map(sim.map(n => [n.id, n]));
let alpha = 1, frames = 0;

function clampRadius(p) {
  const R = 150 + Math.min(60, Math.sqrt(p.lines) * 1.2) + (p.hasEntry ? 0 : 18);
  const dx = p.x - p.ax, dy = p.y - p.ay, d = Math.hypot(dx, dy);
  if (d > R) { p.x = p.ax + (dx / d) * R; p.y = p.ay + (dy / d) * R; }
}
function tick() {
  const n = sim.length;
  for (let i = 0; i < n; i++) {
    const a = sim[i];
    for (let j = i + 1; j < n; j++) {
      const b = sim[j];
      let dx = b.x - a.x, dy = b.y - a.y;
      const d2 = dx * dx + dy * dy || .01;
      if (d2 > 26000) continue;
      const f = 240 / d2, d = Math.sqrt(d2);
      dx /= d; dy /= d;
      a.vx -= dx * f; a.vy -= dy * f;
      b.vx += dx * f; b.vy += dy * f;
    }
  }
  for (const e of edges) {
    const a = simById.get(e.from), b = simById.get(e.to);
    if (!a || !b) continue;
    let dx = b.x - a.x, dy = b.y - a.y;
    const d = Math.hypot(dx, dy) || 1;
    const f = (d - 46) * 0.0006 * alpha;
    dx /= d; dy /= d;
    a.vx += dx * f * 6; a.vy += dy * f * 6;
    b.vx -= dx * f * 6; b.vy -= dy * f * 6;
  }
  for (const p of sim) {
    p.vx += (p.ax - p.x) * 0.03;
    p.vy += (p.ay - p.y) * 0.03;
    p.vx *= 0.8; p.vy *= 0.8;
    p.x += p.vx * alpha; p.y += p.vy * alpha;
    clampRadius(p);
  }
  alpha = Math.max(0.05, alpha * 0.994);
}

// ── 建节点 DOM：每个节点两个 drawable 直接子元素（圆点 + 标签）──
// 初始布局必须落在画布可视区内，否则浏览器不给它记录 paint record，
// drawElementImage 会抛 "No cached paint record for element"。
function buildNodes() {
  if (!HIC) return;
  const frag = document.createDocumentFragment();
  const pending = [];
  const cols = 20, cell = 26;

  // 离屏测量器：标签宽度决定标签盒宽度，否则快照会把文字裁掉
  const meas = document.createElement('div');
  meas.style.cssText = 'position:absolute;left:-99999px;top:0;white-space:nowrap;'
    + 'font:600 10px/13px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace';
  document.body.appendChild(meas);

  for (let idx = 0; idx < sim.length; idx++) {
    const n = sim[idx];
    const col = idx % cols, row = Math.floor(idx / cols);
    const left = 8 + col * cell, top = 8 + row * cell;

    const dot = document.createElement('div');
    dot.className = 'node';
    dot.setAttribute('drawable', '');
    dot.style.setProperty('--c', PKG_COLOR[n.pkg] || '#8899aa');
    dot.style.left = left + 'px';
    dot.style.top = top + 'px';
    dot.style.width = n.d + 'px';
    dot.style.height = n.d + 'px';

    const label = n.id.split('/').pop().replace(/\.ts$/, '');
    meas.textContent = label;
    const textW = Math.ceil(meas.getBoundingClientRect().width) || 0;

    const lbl = document.createElement('div');
    lbl.className = 'lbl';
    lbl.setAttribute('drawable', '');
    lbl.textContent = label;
    lbl.style.left = left + 'px';
    lbl.style.top = (top + n.d) + 'px';
    lbl.style.width = (textW + 2) + 'px';
    lbl.style.height = '13px';

    n.el = dot; n.lbl = lbl; n.lw = textW + 2; n.textW = textW;
    pending.push(n);
    frag.appendChild(dot); frag.appendChild(lbl);
  }
  meas.remove();
  cv.appendChild(frag);
}

// ── 坐标换算 ──
function sx(wx) { return W() / 2 + tx + wx * scale; }
function sy(wy) { return H() / 2 + ty + wy * scale; }

const state = { focus: null, pkg: null, q: '', hover: null, sel: null };
let dirty = true;
let ready = false;
const R = {};              // 运行时诊断（CDP 可读）
window.__diag = R;

function matches(n) {
  if (state.focus && n.chapter !== state.focus) return false;
  if (state.pkg && n.pkg !== state.pkg) return false;
  const q = state.q.trim().toLowerCase();
  if (q) {
    const hay = (n.id + ' ' + (n.exports || []).join(' ') + ' ' + (n.f || '')).toLowerCase();
    if (!hay.includes(q)) return false;
  }
  return true;
}

function updateNodeDecor() {
  if (!HIC) return;
  const hot = state.hover;
  const nbr = hot ? new Set([hot, ...(outMap.get(hot) || []), ...(inMap.get(hot) || [])]) : null;
  const allLabels = scale >= LABEL_MIN_SCALE;
  for (const n of sim) {
    const dim = (nbr && !nbr.has(n.id)) || !matches(n);
    n.el.classList.toggle('hot', hot === n.id);
    n.el.classList.toggle('sel', state.sel === n.id);
    n.el.classList.toggle('dim', dim);
    // 标签：放大到阈值以上才全显示；悬停/选中的那个始终显示
    const show = allLabels || hot === n.id || state.sel === n.id;
    n.lbl.style.opacity = !show ? '0' : (dim ? '.22' : '1');
  }
}

function draw() {
  const w = W(), h = H();
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  const pw = Math.round(w * dpr), ph = Math.round(h * dpr);
  if (cv.width !== pw || cv.height !== ph) { cv.width = pw; cv.height = ph; }
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, w, h);

  // 包名（少量，直接 fillText）
  ctx.font = '600 11px ui-monospace,monospace';
  ctx.textAlign = 'center';
  ctx.globalAlpha = .45;
  for (const [pk, a] of anchor) {
    ctx.fillStyle = PKG_COLOR[pk] || '#8899aa';
    ctx.fillText(pk, sx(a.x), sy(a.y) - 250 * scale - 8);
  }
  ctx.textAlign = 'left';
  ctx.globalAlpha = 1;

  // 边
  const hot = state.hover;
  ctx.lineWidth = 1;
  for (const e of edges) {
    const a = simById.get(e.from), b = simById.get(e.to);
    if (!a || !b) continue;
    if (!matches(a) && !matches(b)) continue;
    const isHot = hot && (e.from === hot || e.to === hot);
    ctx.strokeStyle = isHot ? 'rgba(66,184,131,.5)' : 'rgba(120,150,190,.11)';
    ctx.beginPath(); ctx.moveTo(sx(a.x), sy(a.y)); ctx.lineTo(sx(b.x), sy(b.y)); ctx.stroke();
  }

  // 节点圆点：随缩放；标签：固定字号（1:1 画，不跟着放大）
  if (!HIC || !ready) return;
  let fails = 0, lastErr = '';
  const allLabels = scale >= LABEL_MIN_SCALE;
  for (const n of sim) {
    if (!matches(n)) continue;
    const px = sx(n.x), py = sy(n.y);
    const cd = Math.max(6, n.d * scale);
    if (px + cd < -40 || px - cd > w + 40 || py + cd < -40 || py - cd > h + 40) continue;
    try { ctx.drawElementImage(n.el, px - cd / 2, py - cd / 2, cd, cd); }
    catch (err) { fails++; lastErr = String((err && err.message) || err); }
  }
  if (allLabels || state.hover || state.sel) {
    for (const n of sim) {
      if (!matches(n)) continue;
      if (!(allLabels || state.hover === n.id || state.sel === n.id)) continue;
      const px = sx(n.x), py = sy(n.y);
      const cd = Math.max(6, n.d * scale);
      try { ctx.drawElementImage(n.lbl, px - n.lw / 2, py + cd / 2 + 2, n.lw, 13); }
      catch (err) { fails++; lastErr = String((err && err.message) || err); }
    }
  }
  R.drawFails = fails; R.drawErr = lastErr; R.drawnAt = Date.now();
}

function loop() {
  if (alpha > 0.05) { tick(); tick(); frames++; dirty = true; }
  // 首两帧只让浏览器完成一次布局/绘制，给每个 drawable 生成 paint record
  if (!ready) {
    if (frames >= 2) { ready = true; dirty = true; }
    else { frames++; requestAnimationFrame(loop); return; }
  }
  if (dirty) { updateNodeDecor(); draw(); dirty = false; }
  requestAnimationFrame(loop);
}

function fit() {
  let minx = 1e9, maxx = -1e9, miny = 1e9, maxy = -1e9;
  for (const a of anchor.values()) {
    minx = Math.min(minx, a.x); maxx = Math.max(maxx, a.x);
    miny = Math.min(miny, a.y); maxy = Math.max(maxy, a.y);
  }
  const pad = 265;
  const s = Math.min(W() / (maxx - minx + pad * 2), H() / (maxy - miny + pad * 2), 1.8);
  scale = Math.max(0.22, s);
  tx = -((minx + maxx) / 2) * scale;
  ty = -((miny + maxy) / 2) * scale;
  dirty = true;
}
function fitTo(ids) {
  const pts = ids.map(id => simById.get(id)).filter(Boolean);
  if (!pts.length) return;
  let minx = 1e9, maxx = -1e9, miny = 1e9, maxy = -1e9;
  for (const p of pts) {
    minx = Math.min(minx, p.x); maxx = Math.max(maxx, p.x);
    miny = Math.min(miny, p.y); maxy = Math.max(maxy, p.y);
  }
  const s = Math.min(W() / (maxx - minx + 330), H() / (maxy - miny + 330), 2.2);
  scale = Math.max(0.45, s);
  tx = -((minx + maxx) / 2) * scale;
  ty = -((miny + maxy) / 2) * scale;
  dirty = true;
}

// ── 交互：自己算命中（元素的几何是“上次画到哪”，不拿来当真相）──
function pick(ev) {
  const r = cv.getBoundingClientRect();
  const mx = ev.clientX - r.left, my = ev.clientY - r.top;
  let best = null, bd = 1e9;
  for (const n of sim) {
    if (!matches(n)) continue;
    const d = Math.hypot(sx(n.x) - mx, sy(n.y) - my);
    const hit = Math.max(6, (n.d * scale) / 2 + 4);
    if (d < hit && d < bd) { bd = d; best = n; }
  }
  return best;
}
let drag = null;
cv.addEventListener('mousedown', e => { drag = { x: e.clientX, y: e.clientY, tx, ty, moved: false }; cv.classList.add('drag'); });
window.addEventListener('mouseup', () => { drag = null; cv.classList.remove('drag'); });
window.addEventListener('mousemove', e => {
  if (drag) {
    const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
    if (Math.abs(dx) + Math.abs(dy) > 3) drag.moved = true;
    tx = drag.tx + dx; ty = drag.ty + dy; dirty = true; return;
  }
  const n = pick(e);
  const id = n ? n.id : null;
  if (id !== state.hover) { state.hover = id; dirty = true; }
});
cv.addEventListener('click', e => {
  if (drag && drag.moved) return;
  const n = pick(e);
  if (n) { state.sel = n.id; renderDetail(n.id); dirty = true; }
});
cv.addEventListener('wheel', e => {
  e.preventDefault();
  const r = cv.getBoundingClientRect();
  const mx = e.clientX - r.left - W() / 2, my = e.clientY - r.top - H() / 2;
  const ns = Math.min(5, Math.max(.28, scale * (e.deltaY < 0 ? 1.1 : 0.9)));
  tx = mx - (mx - tx) * (ns / scale);
  ty = my - (my - ty) * (ns / scale);
  scale = ns; dirty = true;
}, { passive: false });
window.addEventListener('resize', () => { dirty = true; });

// ── 左栏 / 搜索 / chips ──
const chapEl = document.getElementById('chapters');
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
chapEl.innerHTML = '<div class="sect">学习路线</div>'
  + '<button class="chap on" data-ch="">全部文件<em>' + nodes.length + ' 个节点 · ' + edges.length + ' 条依赖</em></button>'
  + '<div class="sect">9 章 · 约 10 小时</div>'
  + chapters.map(c => '<button class="chap" data-ch="' + c.id + '"><i>CH ' + String(c.order).padStart(2, '0') + ' · ' + c.minutes + ' 分钟</i>' + esc(c.title) + '</button>').join('');

const chips = document.getElementById('chips');
chips.innerHTML = '<span class="chip on" data-pkg="">全部包</span>' + pkgs.map(p =>
  '<span class="chip" data-pkg="' + p + '" style="border-color:' + (PKG_COLOR[p] || '#888') + '44">' + p + '</span>').join('');
chips.addEventListener('click', e => {
  const c = e.target.closest('.chip'); if (!c) return;
  chips.querySelectorAll('.chip').forEach(x => x.classList.remove('on'));
  c.classList.add('on');
  state.pkg = c.dataset.pkg || null; dirty = true;
});
chapEl.addEventListener('click', e => {
  const b = e.target.closest('.chap'); if (!b) return;
  chapEl.querySelectorAll('.chap').forEach(x => x.classList.remove('on'));
  b.classList.add('on');
  state.focus = b.dataset.ch || null;
  state.sel = null; dirty = true;
  if (state.focus) {
    renderChapter(state.focus);
    const c = chapters.find(x => x.id === state.focus);
    if (c) fitTo(c.files);
  } else { renderEmpty(); fit(); }
});
document.getElementById('legend').innerHTML = pkgs.map(p =>
  '<span><b style="background:' + (PKG_COLOR[p] || '#888') + '"></b>' + p + '</span>').join('');
document.getElementById('stat').textContent = nodes.length + ' files · ' + edges.length + ' imports';
document.getElementById('q').addEventListener('input', e => { state.q = e.target.value; dirty = true; });

// ── 右栏 ──
const right = document.getElementById('right');
function relLinks(list) {
  const uniq = [...new Set(list || [])];
  if (!uniq.length) return '<span class="empty">无</span>';
  return uniq.map(p => {
    const n = byId.get(p);
    if (!n) return '<span class="rel" style="color:#5d6b82;cursor:default">' + esc(p) + ' <span style="color:#40506a">(不在图中)</span></span>';
    return '<span class="rel" data-go="' + esc(p) + '">' + esc(p) + ' <span style="color:#5d6b82">(' + n.lines + ' 行)</span></span>';
  }).join('');
}
function renderDetail(id) {
  const n = byId.get(id);
  if (!n) return;
  const chap = chapters.find(c => c.id === n.chapter);
  const rDeps = (n.r || []).filter(x => x && x !== '-');
  right.innerHTML = '<div class="detail">'
    + '<div class="path">' + esc(n.id) + '</div>'
    + '<div class="badges">'
    + '<span class="badge">' + esc(n.pkg) + '</span>'
    + '<span class="badge">' + n.lines + ' 行</span>'
    + (n.tags ? '<span class="badge tag">' + esc(n.tags) + '</span>' : '<span class="badge" style="color:#5d6b82">无 AOCI 条目</span>')
    + '<span class="badge">被 ' + inMap.get(id).length + ' 依赖 · 依赖 ' + outMap.get(id).length + '</span>'
    + (chap ? '<span class="badge" style="border-color:#3a4a5e;color:#9fb0c8">CH' + String(chap.order).padStart(2, '0') + '</span>' : '')
    + '</div>'
    + (n.hasEntry
      ? '<div class="field"><h4>F · 职责</h4><p>' + esc(n.f || '—') + '</p></div>'
        + '<div class="field"><h4>R · 必须一起读</h4>' + (rDeps.length ? rDeps.map(p => '<span class="rel" data-go="' + esc(p) + '">' + esc(p) + '</span>').join('') : '<span class="empty">无强关联</span>') + '</div>'
        + '<div class="field"><h4>A · 对外符号</h4><p style="font-family:var(--mono);font-size:12px;color:#8bd450">' + esc(n.a || '—') + '</p></div>'
        + '<div class="field"><h4>S · 不能改坏的约束</h4><p style="color:#ffb86c">' + esc(n.s || '—') + '</p></div>'
      : '<div class="field"><h4>状态</h4><p class="empty">该文件未进入 AOCI 索引范围（tests / 私有包），结构关系仍然有效。</p></div>')
    + '<hr>'
    + '<div class="field"><h4>它 import 了谁</h4>' + relLinks(outMap.get(id)) + '</div>'
    + '<div class="field"><h4>谁 import 了它</h4>' + relLinks(inMap.get(id)) + '</div>'
    + '</div>';
  right.querySelectorAll('[data-go]').forEach(el2 => el2.onclick = () => {
    const t = el2.dataset.go; state.sel = t; state.hover = t; renderDetail(t); dirty = true;
  });
  right.scrollTop = 0;
}
function renderChapter(cid) {
  const c = chapters.find(x => x.id === cid);
  const files = nodes.filter(n => n.chapter === cid);
  right.innerHTML = '<div class="chapcard">'
    + '<div class="time">CH' + String(c.order).padStart(2, '0') + ' · 约 ' + c.minutes + ' 分钟 · ' + files.length + ' 个文件</div>'
    + '<h2>' + esc(c.title) + '</h2>'
    + '<h3>读完你要能做到</h3><p>' + esc(c.goal) + '</p>'
    + '<h3>必读文件（按顺序）</h3><ul class="readlist">'
    + c.files.map(f => {
      const n = byId.get(f);
      return '<li data-go="' + esc(f) + '">' + esc(f.replace('packages/', '')) + '<span>' + (n ? n.lines + ' 行' : '—') + '</span></li>';
    }).join('')
    + '</ul>'
    + '<h3>关键结论</h3><ul>' + c.concepts.map(x => '<li>' + esc(x) + '</li>').join('') + '</ul>'
    + '<h3>自检问题</h3><ul>' + c.questions.map(x => '<li>' + esc(x) + '</li>').join('') + '</ul>'
    + '<h3>动手</h3><div class="ex">' + esc(c.exercise) + '</div>'
    + '</div>';
  right.querySelectorAll('[data-go]').forEach(el2 => el2.onclick = () => {
    const t = el2.dataset.go; state.sel = t; state.hover = t; state.focus = null;
    chapEl.querySelectorAll('.chap').forEach(x => x.classList.remove('on'));
    const all = chapEl.querySelector('.chap[data-ch=""]');
    if (all) all.classList.add('on');
    renderDetail(t); dirty = true;
  });
  right.scrollTop = 0;
}
function renderEmpty() {
  right.innerHTML = '<div class="empty-state">← 点左边任一章开始<br>或点图中任一节点</div>';
}

// ── 启动 ──
document.getElementById('nocap').hidden = HIC;
buildNodes();
fit();
(function deepLink() {
  const h = decodeURIComponent(location.hash.slice(1));
  if (!h) { renderEmpty(); return; }
  if (/^ch[0-9]$/.test(h) && chapters.some(c => c.id === h)) {
    state.focus = h;
    chapEl.querySelectorAll('.chap').forEach(x => x.classList.toggle('on', x.dataset.ch === h));
    renderChapter(h);
    const c = chapters.find(x => x.id === h);
    if (c) setTimeout(() => fitTo(c.files), 1400);
  } else if (byId.has(h)) {
    state.sel = h; state.hover = h; renderDetail(h);
  } else { renderEmpty(); }
})();
requestAnimationFrame(loop);

// 自检钩子（只读，给 headless 验证用：拿某节点的屏幕坐标、当前比例、被选中的节点）
window.__probe = {
  at(id) { const n = simById.get(id); return n ? [Math.round(sx(n.x)), Math.round(sy(n.y))] : null; },
  scale: () => scale,
  sel: () => state.sel,
  bench(n = 30) { const t0 = performance.now(); for (let i = 0; i < n; i++) draw(); return +((performance.now() - t0) / n).toFixed(2); },
  // 找一个落在画布可见区内的节点，返回它的屏幕点（自检时用来点它）
  firstVisible() {
    const w = W(), h = H();
    for (const n of sim) {
      const x = sx(n.x), y = sy(n.y);
      if (x > 30 && x < w - 30 && y > 30 && y < h - 30) return { id: n.id, x: Math.round(x), y: Math.round(y) };
    }
    return null;
  },
};
</script>
</body>
</html>
